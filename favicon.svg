<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Clean White Rounded Background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Subtle Hardware Circuit Accent Traces -->
  <path d="M10 16 L10 10 L16 10" fill="none" stroke="#007ea7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <circle cx="10" cy="16" r="2" fill="#007ea7"/>
  
  <path d="M54 48 L54 54 L48 54" fill="none" stroke="#008c61" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <circle cx="54" cy="48" r="2" fill="#008c61"/>

  <!-- Bold Hardware Monogram 'AE' -->
  <text x="32" y="42" 
        font-family="-apple-system, BlinkMacSystemFont, 'Space Grotesk', 'JetBrains Mono', 'Segoe UI', sans-serif" 
        font-weight="900" 
        font-size="30" 
        fill="#07090d" 
        text-anchor="middle" 
        letter-spacing="-1">AE</text>
</svg>
