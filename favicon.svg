<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Parchment base with bold neo-brutalist frame -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#FAF9F5" stroke="#141413" stroke-width="3.5" />

  <!-- Symmetric PCB corner traces and via pads -->
  <path d="M11 22 V11 H22" stroke="#D97757" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="11" cy="22" r="3.2" fill="#D97757" stroke="#141413" stroke-width="1.5" />
  <circle cx="22" cy="11" r="2.5" fill="#D97757" stroke="#141413" stroke-width="1.5" />

  <path d="M53 42 V53 H42" stroke="#E5984B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="53" cy="42" r="3.2" fill="#E5984B" stroke="#141413" stroke-width="1.5" />
  <circle cx="42" cy="53" r="2.5" fill="#E5984B" stroke="#141413" stroke-width="1.5" />

  <!-- Bold AE Hardware Monogram -->
  <text x="32" y="42"
        font-family="'Space Grotesk', 'JetBrains Mono', system-ui, sans-serif"
        font-weight="800"
        font-size="27"
        fill="#141413"
        text-anchor="middle"
        letter-spacing="-1">AE</text>
</svg>
