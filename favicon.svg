<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="copperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7E4A"/>
      <stop offset="100%" stop-color="#D65A28"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5BC0BE"/>
      <stop offset="100%" stop-color="#2A7D7B"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F6F1EA"/>
    </linearGradient>
  </defs>

  <!-- Clean Rounded Card Base with Warm Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="rgba(214, 90, 40, 0.28)" stroke-width="1.5" />

  <!-- Hardware Circuit Accent Traces in Copper and Teal -->
  <path d="M10 18 L10 10 L18 10" fill="none" stroke="url(#copperGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="10" cy="18" r="2.2" fill="#FF7E4A"/>

  <path d="M54 46 L54 54 L46 54" fill="none" stroke="url(#tealGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="54" cy="46" r="2.2" fill="#5BC0BE"/>

  <!-- Bold Hardware Monogram 'AE' -->
  <text x="32" y="43" 
        font-family="'Sora', 'JetBrains Mono', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
        font-weight="800" 
        font-size="28" 
        fill="#1A1C1E" 
        text-anchor="middle" 
        letter-spacing="-0.5">AE</text>
</svg>
